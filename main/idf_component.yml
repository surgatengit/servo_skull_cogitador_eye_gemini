dependencies:
  idf: ">=6.2"
  esp-mosaico-bsp:
    version: "*"
    # VOX fork of the BSP at submodule commit 5f88b91 with one change; see
    # third_party/esp-mosaico-bsp/VOX_FORK.md and tools/check_bsp_fork.py.
    override_path: "../third_party/esp-mosaico-bsp"
  # Verbatim BSP camera component (fase 2), resolving esp-mosaico-bsp to the fork.
  # It patches ESP-IDF's DVP driver at configure time (owner's decision, HANDOFF §5).
  mosaico_module_camera:
    version: "*"
    override_path: "../third_party/mosaico_module_camera"
  esp_iris:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-utils/ESP-Iris/components/esp_iris"
  espressif/esp-gsp: "==1.5.1"
  # The BSP display adapter uses headers deprecated by LVGL 9.6.
  lvgl/lvgl: "==9.5.0"
